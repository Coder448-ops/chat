<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cipher Global | Access Granted</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        
        body {
            background-color: #030303;
            color: #00ff41;
            font-family: 'JetBrains Mono', monospace;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .terminal-container {
            width: 100%;
            max-width: 1000px;
            height: 85vh;
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(0, 255, 65, 0.05);
            position: relative;
        }

        #login-overlay {
            position: absolute;
            inset: 0;
            background: #050505;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .messages-window {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            background: rgba(0,0,0,0.3);
        }

        .input-wrapper {
            padding: 20px;
            background: #000;
            border-top: 1px solid #111;
            display: flex;
            gap: 15px;
        }

        input {
            background: transparent;
            border: 1px solid #222;
            color: #fff;
            padding: 12px;
            outline: none;
            width: 100%;
        }

        input:focus { border-color: #00ff41; }

        .msg-block { margin-bottom: 12px; line-height: 1.4; }
        .user-label { color: #00ff41; font-weight: bold; margin-right: 8px; }
        .time-label { color: #444; font-size: 0.7rem; margin-right: 10px; }
        
        .glitch-btn {
            background: #00ff41;
            color: #000;
            font-weight: 800;
            padding: 12px 40px;
            margin-top: 20px;
            cursor: pointer;
            border: none;
        }

        .glitch-btn:hover { background: #fff; }
    </style>
</head>
<body>

    <div class="terminal-container">
        <!-- LOGIN SCREEN -->
        <div id="login-overlay">
            <div class="text-center">
                <div class="text-[10px] tracking-[10px] mb-4 opacity-50">GLOBAL_UPLINK_V3</div>
                <h1 class="text-4xl font-black mb-10 text-white">ACCESS_REQUIRED</h1>
                <input type="text" id="user-name" placeholder="Ismingizni kiriting..." class="text-center w-72">
                <br>
                <button onclick="startSession()" class="glitch-btn">INITIALIZE</button>
            </div>
        </div>

        <!-- MAIN CHAT -->
        <div class="p-4 bg-zinc-900/50 flex justify-between items-center text-[10px] border-b border-zinc-800">
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                <span>GLOBAL_SERVER: CONNECTED</span>
            </div>
            <span id="my-node">NODE: UNAUTHORIZED</span>
        </div>

        <div id="messages-flow" class="messages-window">
            <div class="msg-block"><span class="text-zinc-600">[*] Tizim yuklanmoqda... Tayyor.</span></div>
        </div>

        <div class="input-wrapper">
            <span class="text-zinc-700 font-bold">$</span>
            <input type="text" id="chat-msg" placeholder="Butun dunyoga xabar yuborish..." autocomplete="off">
        </div>
    </div>

    <script>
        let myNick = "";
        const GLOBAL_CH = "cipher_world_net_888"; // Global kanal nomi

        // PubNub Global Messenger
        const pubnub = new PubNub({
            publishKey: 'pub-c-4613c72b-8b5d-4f11-9a7f-94a3a60a7246',
            subscribeKey: 'sub-c-13d8a7d6-3e7b-4028-874e-5e929b3a985a',
            uuid: "cipher_" + Math.random().toString(36).substr(2, 5)
        });

        function startSession() {
            const name = document.getElementById('user-name').value.trim();
            if(!name) return;
            
            myNick = name;
            document.getElementById('my-node').innerText = "NODE: " + myNick;
            document.getElementById('login-overlay').style.display = 'none';
            
            // Global tarmoqqa ulanish
            pubnub.subscribe({ channels: [GLOBAL_CH] });
            
            // Birinchi xabar
            sendToGlobal("[SYSTEM]", myNick + " tarmoqqa ulandi.");
        }

        // Xabarlarni qabul qilish
        pubnub.addListener({
            message: function(event) {
                renderUI(event.message.user, event.message.text);
            }
        });

        function sendToGlobal(user, text) {
            pubnub.publish({
                channel: GLOBAL_CH,
                message: { user: user, text: text }
            });
        }

        function renderUI(user, text) {
            const flow = document.getElementById('messages-flow');
            const div = document.createElement('div');
            div.className = 'msg-block';
            const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            div.innerHTML = `
                <span class="time-label">${time}</span>
                <span class="user-label">${user}></span>
                <span class="text-white">${text}</span>
            `;
            
            flow.appendChild(div);
            flow.scrollTop = flow.scrollHeight;
        }

        // Xabar yuborish (Enter)
        document.getElementById('chat-msg').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const val = e.target.value.trim();
                if (!val) return;
                sendToGlobal(myNick, val);
                e.target.value = '';
            }
        });

        // Login (Enter)
        document.getElementById('user-name').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') startSession();
        });
    </script>
</body>
</html>
