<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cipher Terminal | Zero-Protocol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;500;700&display=swap');

        :root {
            --neon-green: #00ff41;
            --dark-bg: #0a0a0a;
            --terminal-gray: #1a1a1a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Fira Code', monospace;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--neon-green);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Matrix Background Effect */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            opacity: 0.1;
        }

        .terminal-window {
            width: 95%;
            max-width: 1200px;
            height: 90vh;
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid #333;
            box-shadow: 0 0 40px rgba(0, 255, 65, 0.1);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .terminal-header {
            background: var(--terminal-gray);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .header-dots {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .red { background: #ff5f56; }
        .yellow { background: #ffbd2e; }
        .green { background: #27c93f; }

        .chat-output {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scrollbar-width: thin;
            scrollbar-color: var(--neon-green) transparent;
        }

        .chat-output::-webkit-scrollbar { width: 4px; }
        .chat-output::-webkit-scrollbar-thumb { background: var(--neon-green); }

        .message-row {
            animation: fadeIn 0.2s ease-out;
            border-left: 1px solid rgba(0, 255, 65, 0.2);
            padding-left: 15px;
            margin-bottom: 5px;
        }

        .timestamp {
            color: #555;
            font-size: 0.75rem;
            margin-right: 10px;
        }

        .user-tag {
            color: #fff;
            font-weight: bold;
            margin-right: 10px;
        }

        .content {
            word-break: break-all;
            line-height: 1.6;
        }

        .input-area {
            padding: 20px 30px;
            background: #0d0d0d;
            border-top: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .prompt {
            color: var(--neon-green);
            font-weight: bold;
        }

        #command-input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            width: 100%;
            font-size: 1rem;
        }

        .glitch-text {
            position: relative;
            animation: glitch 2s infinite;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes glitch {
            0% { text-shadow: 1px 0 0 red, -1px 0 0 blue; }
            50% { text-shadow: -1px 0 0 red, 1px 0 0 blue; }
            100% { text-shadow: 1px 0 0 red, -1px 0 0 blue; }
        }

        .system-msg {
            color: #ffbd2e;
            font-style: italic;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <div class="terminal-window">
        <div class="terminal-header">
            <div class="header-dots">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
            </div>
            <div class="text-[10px] uppercase tracking-[4px] opacity-50">Cipher_Protocol_v6.0</div>
            <div class="text-[10px] opacity-50">NODE: 127.0.0.1</div>
        </div>

        <div id="output" class="chat-output">
            <div class="message-row">
                <span class="system-msg">[SYSTEM] Terminal yuklandi. Barcha xabarlar local xotiraga yozilmoqda.</span>
            </div>
        </div>

        <div class="input-area">
            <span class="prompt">cipher@root:~$</span>
            <input type="text" id="command-input" placeholder="Xabar yozing..." autofocus autocomplete="off">
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        const output = document.getElementById('output');
        const input = document.getElementById('command-input');

        // Matrix Background
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()*&^%";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0F0";
            ctx.font = fontSize + "px arial";
            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        // Chat Logic
        function addMessage(user, text, isSystem = false) {
            const row = document.createElement('div');
            row.className = 'message-row';
            
            const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second: '2-digit'});
            
            if(isSystem) {
                row.innerHTML = `<span class="system-msg">[${time}] ${text}</span>`;
            } else {
                row.innerHTML = `
                    <span class="timestamp">${time}</span>
                    <span class="user-tag">${user}></span>
                    <span class="content">${text}</span>
                `;
            }
            
            output.appendChild(row);
            output.scrollTop = output.scrollHeight;
        }

        // Local Storage dan yuklash
        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('terminal_logs') || '[]');
            history.forEach(item => {
                addMessage(item.user, item.text);
            });
        }

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const val = input.value.trim();
                if (!val) return;

                // Xabarni saqlash
                const history = JSON.parse(localStorage.getItem('terminal_logs') || '[]');
                const newMsg = { user: 'CIPHER', text: val };
                history.push(newMsg);
                localStorage.setItem('terminal_logs', JSON.stringify(history));

                addMessage('CIPHER', val);
                input.value = '';

                // Maxsus buyruqlar
                if (val === '/clear') {
                    localStorage.removeItem('terminal_logs');
                    output.innerHTML = '';
                    addMessage(null, 'Terminal tozalandi.', true);
                }
            }
        });

        // Boshqa oynada yozilsa, bunda ham chiqishi uchun
        window.addEventListener('storage', (e) => {
            if (e.key === 'terminal_logs') {
                const history = JSON.parse(e.newValue);
                const lastMsg = history[history.length - 1];
                addMessage(lastMsg.user, lastMsg.text);
            }
        });

        loadHistory();
    </script>
</body>
</html>
