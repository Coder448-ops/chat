<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cipher Global v4 | Secure Uplink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        
        body {
            background-color: #020202;
            color: #00ff41;
            font-family: 'JetBrains Mono', monospace;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .main-frame {
            width: 100%;
            max-width: 950px;
            height: 85vh;
            background: #080808;
            border: 1px solid #151515;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 50px rgba(0, 255, 65, 0.03);
        }

        #auth-overlay {
            position: absolute;
            inset: 0;
            background: #000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            background: radial-gradient(circle at top, #0a0a0a 0%, #000 100%);
        }

        .input-bar {
            padding: 20px;
            background: #050505;
            border-top: 1px solid #111;
            display: flex;
            gap: 10px;
        }

        input {
            background: transparent;
            border: 1px solid #222;
            color: #fff;
            padding: 12px 20px;
            outline: none;
            width: 100%;
            font-size: 0.9rem;
        }

        input:focus { border-color: #00ff41; }

        .message { margin-bottom: 12px; animation: slideIn 0.2s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .nick { color: #00ff41; font-weight: bold; margin-right: 10px; }
        .time { color: #333; font-size: 0.7rem; margin-right: 10px; }
        
        .btn-access {
            background: #00ff41;
            color: #000;
            font-weight: 900;
            padding: 12px 50px;
            margin-top: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
        }

        .btn-access:hover { background: #fff; box-shadow: 0 0 20px #00ff41; }
    </style>
</head>
<body>

    <div class="main-frame">
        <!-- KIRISH SAHIFASI -->
        <div id="auth-overlay">
            <div class="text-center">
                <div class="text-[10px] text-zinc-600 tracking-[12px] mb-6">GLOBAL_DATA_LINK</div>
                <h1 class="text-5xl font-black text-white mb-12">LOGIN_CORE</h1>
                <input type="text" id="user-nick" placeholder="Nikingizni yozing..." class="text-center w-80">
                <br>
                <button onclick="connectSystem()" class="btn-access">CONNECT</button>
            </div>
        </div>

        <!-- ASOSIY CHAT -->
        <div class="h-12 bg-zinc-900/80 border-b border-zinc-800 flex justify-between items-center px-6 text-[10px] uppercase">
            <div class="flex items-center gap-3">
                <div id="status-led" class="w-2 h-2 bg-red-600 rounded-full"></div>
                <span id="status-text">Disconnected</span>
            </div>
            <span id="node-tag">User: Unauthorized</span>
        </div>

        <div id="chat-box" class="chat-container">
            <div class="message text-zinc-700 text-xs">[*] Tizim standby rejimida...</div>
        </div>

        <div class="input-bar">
            <span class="text-zinc-800 font-bold self-center">$</span>
            <input type="text" id="msg-input" placeholder="Xabarni butun dunyoga tarqating..." autocomplete="off">
        </div>
    </div>

    <script>
        let myName = "";
        // Ably bepul API kaliti (Global ulanish uchun)
        const ably = new Ably.Realtime('8_O_vA.p_C_pA:B_1_B_1_B_1_B_1_B_1_B_1'); 
        // Izoh: Yuqoridagi kalit misol uchun, real chat uchun o'z kalitingni Ably'dan olsang bo'ladi
        const channel = ably.channels.get('cipher-global-room');

        function connectSystem() {
            const input = document.getElementById('user-nick');
            if(!input.value.trim()) return;

            myName = input.value.trim();
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('node-tag').innerText = "Node: " + myName;

            // Tarmoqqa ulanish holati
            ably.connection.on('connected', () => {
                document.getElementById('status-led').className = "w-2 h-2 bg-green-500 rounded-full shadow-[0_0_10px_#00ff41]";
                document.getElementById('status-text').innerText = "Global Online";
                
                // Kirish xabari
                channel.publish('entry', { user: 'SYSTEM', text: myName + " tarmoqqa ulandi." });
            });

            // Xabarlarni eshitish
            channel.subscribe('msg', (m) => {
                renderMessage(m.data.user, m.data.text);
            });
            
            channel.subscribe('entry', (m) => {
                const box = document.getElementById('chat-box');
                const d = document.createElement('div');
                d.className = "text-[10px] text-zinc-600 my-2 text-center italic";
                d.innerText = m.data.text;
                box.appendChild(d);
            });
        }

        function renderMessage(user, text) {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = 'message';
            const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            div.innerHTML = `
                <span class="time">${time}</span>
                <span class="nick">${user}></span>
                <span class="text-white">${text}</span>
            `;
            
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        document.getElementById('msg-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const val = e.target.value.trim();
                if (!val) return;

                channel.publish('msg', { user: myName, text: val });
                e.target.value = '';
            }
        });

        // Login Enter
        document.getElementById('user-nick').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') connectSystem();
        });
    </script>
</body>
</html>
