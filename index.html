<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cipher Dark-Net | Anonymous Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;500;700&display=swap');

        :root {
            --neon-red: #ff003c;
            --dark-space: #050505;
            --terminal-bg: rgba(10, 10, 10, 0.95);
        }

        body {
            background-color: var(--dark-space);
            color: #e0e0e0;
            font-family: 'Fira Code', monospace;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .terminal {
            width: 95%;
            max-width: 1100px;
            height: 85vh;
            background: var(--terminal-bg);
            border: 1px solid #1a1a1a;
            box-shadow: 0 0 50px rgba(255, 0, 60, 0.1);
            display: flex;
            flex-direction: column;
            border-radius: 5px;
            position: relative;
        }

        .terminal::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-red), transparent);
        }

        #chat-flow {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
        }

        .msg-entry {
            border-left: 2px solid #333;
            padding: 5px 15px;
            animation: arrive 0.3s ease;
        }

        @keyframes arrive {
            from { opacity: 0; transform: translateX(-5px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .user-id { color: var(--neon-red); font-weight: bold; }
        .timestamp { color: #555; font-size: 0.7rem; margin-right: 8px; }
        .text-content { color: #ccc; }

        .input-box {
            background: #0a0a0a;
            padding: 20px;
            border-top: 1px solid #1a1a1a;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        #message-input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            flex: 1;
            font-size: 0.9rem;
        }

        .status-bar {
            padding: 5px 20px;
            background: #000;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #444;
            display: flex;
            justify-content: space-between;
        }

        /* Scrollbar */
        #chat-flow::-webkit-scrollbar { width: 3px; }
        #chat-flow::-webkit-scrollbar-thumb { background: var(--neon-red); }
    </style>
</head>
<body>

    <div class="terminal">
        <div class="status-bar">
            <span>Uplink: STABLE</span>
            <span>Cipher Protocol Active</span>
            <span id="node-id">Node: Scanning...</span>
        </div>

        <div id="chat-flow">
            <!-- Xabarlar shu yerga tushadi -->
        </div>

        <div class="input-box">
            <span class="text-red-600 font-bold">></span>
            <input type="text" id="message-input" placeholder="Xabarni yozing va Enter bosing..." autofocus autocomplete="off">
        </div>
    </div>

    <script>
        // BU ENG MUHIM QISMI: ID-siz ulanish uchun umumiy kanal
        const CHANNEL_NAME = "cipher_global_secure_node";
        const nodeName = "User_" + Math.floor(Math.random() * 9999);
        document.getElementById('node-id').innerText = "Node: " + nodeName;

        // PubNub - bu bepul va ID raqamsiz xabar yuborish uchun platforma
        const pubnub = new PubNub({
            publishKey: 'pub-c-4613c72b-8b5d-4f11-9a7f-94a3a60a7246', // Ochiq test kaliti
            subscribeKey: 'sub-c-13d8a7d6-3e7b-4028-874e-5e929b3a985a',
            uuid: nodeName
        });

        const chatFlow = document.getElementById('chat-flow');
        const msgInput = document.getElementById('message-input');

        // Xabarlarni qabul qilish
        pubnub.addListener({
            message: function(event) {
                renderMessage(event.message.user, event.message.text);
            }
        });

        pubnub.subscribe({
            channels: [CHANNEL_NAME]
        });

        // Xabarni ekranga chiqarish
        function renderMessage(user, text) {
            const div = document.createElement('div');
            div.className = 'msg-entry';
            const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            div.innerHTML = `
                <span class="timestamp">${time}</span>
                <span class="user-id">${user}@cipher:</span>
                <span class="text-content">${text}</span>
            `;
            
            chatFlow.appendChild(div);
            chatFlow.scrollTop = chatFlow.scrollHeight;
        }

        // Xabarni yuborish
        msgInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const val = msgInput.value.trim();
                if (!val) return;

                pubnub.publish({
                    channel: CHANNEL_NAME,
                    message: {
                        user: nodeName,
                        text: val
                    }
                });

                msgInput.value = '';
            }
        });

        // Tizimga xabar
        renderMessage("SYSTEM", "Kanalga ulanish muvaffaqiyatli bajarildi. ID shart emas.");
    </script>
</body>
</html>
