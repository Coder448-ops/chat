<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIPHER | Global Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;500;700&family=Orbitron:wght@400;900&display=swap');

        :root {
            --neon-blue: #00f3ff;
            --dark-void: #020205;
            --matrix-green: #00ff41;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--dark-void);
            color: var(--matrix-green);
            font-family: 'Fira Code', monospace;
            overflow: hidden;
        }

        /* LOGIN SCREEN */
        #login-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #0a0a15 0%, #000 100%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease;
        }

        .login-hidden { opacity: 0; pointer-events: none; }

        .input-cyber {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #1a1a1a;
            color: #fff;
            padding: 12px 20px;
            width: 280px;
            margin: 10px 0;
            text-align: center;
            outline: none;
            font-size: 1rem;
            transition: all 0.3s;
            border-radius: 4px;
        }

        .input-cyber:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
        }

        .btn-auth {
            margin-top: 20px;
            padding: 12px 40px;
            background: transparent;
            border: 1px solid var(--matrix-green);
            color: var(--matrix-green);
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.4s;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-auth:hover {
            background: var(--matrix-green);
            color: #000;
            box-shadow: 0 0 30px var(--matrix-green);
        }

        /* MAIN CHAT LAYOUT */
        #main-container {
            display: none;
            height: 100vh;
            flex-direction: row;
            background: #000;
        }

        /* SIDEBAR */
        .sidebar {
            width: 300px;
            background: #0a0a0f;
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid #222;
            background: #000;
        }

        .sidebar-header h2 {
            color: var(--neon-blue);
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .user-info {
            font-size: 0.75rem;
            color: var(--matrix-green);
            margin-top: 5px;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid #ff4444;
            color: #ff4444;
            padding: 6px 12px;
            font-size: 0.7rem;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: #ff4444;
            color: #000;
        }

        /* CHAT TABS */
        .tabs-container {
            padding: 10px;
            border-bottom: 1px solid #222;
            display: flex;
            gap: 5px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            background: #1a1a1f;
            border: 1px solid #333;
            color: #888;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .tab-btn.active {
            background: var(--dark-void);
            border-color: var(--neon-blue);
            color: var(--neon-blue);
        }

        /* USERS LIST */
        .users-list {
            flex: 1;
            overflow-y: auto;
            padding: 5px;
        }

        .user-item {
            padding: 12px;
            margin: 5px 0;
            background: #1a1a1f;
            border-left: 2px solid #333;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 3px;
        }

        .user-item:hover {
            background: #252530;
            border-left-color: var(--neon-blue);
        }

        .user-item.active {
            background: #1a2a2a;
            border-left-color: var(--matrix-green);
        }

        .user-name {
            color: var(--neon-blue);
            font-weight: bold;
            font-size: 0.85rem;
        }

        .user-status {
            font-size: 0.7rem;
            color: #666;
        }

        /* MAIN CHAT AREA */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .chat-header {
            padding: 15px 25px;
            border-bottom: 1px solid #222;
            background: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header-title {
            color: var(--neon-blue);
            font-size: 1rem;
            letter-spacing: 1px;
        }

        .chat-header-subtitle {
            font-size: 0.75rem;
            color: #666;
            margin-top: 3px;
        }

        /* MESSAGES AREA */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            gap: 10px;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .message.sent {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 50%;
            padding: 10px 15px;
            border-radius: 5px;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .message.received .message-bubble {
            background: #1a1a1f;
            border-left: 2px solid var(--neon-blue);
            color: #e0e0e0;
        }

        .message.sent .message-bubble {
            background: #003d4d;
            border-right: 2px solid var(--neon-blue);
            color: #fff;
        }

        .message-time {
            font-size: 0.7rem;
            color: #666;
            padding: 0 5px;
            align-self: flex-end;
        }

        .empty-chat {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
        }

        .empty-chat p {
            font-size: 0.9rem;
            margin-top: 10px;
        }

        /* INPUT AREA */
        .input-area {
            padding: 15px 25px;
            background: #000;
            border-top: 1px solid #222;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .input-area input {
            flex: 1;
            background: #1a1a1f;
            border: 1px solid #333;
            color: #fff;
            padding: 10px 15px;
            border-radius: 3px;
            outline: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .input-area input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.1);
        }

        .send-btn {
            padding: 10px 20px;
            background: transparent;
            border: 1px solid var(--matrix-green);
            color: var(--matrix-green);
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 3px;
            font-weight: bold;
        }

        .send-btn:hover {
            background: var(--matrix-green);
            color: #000;
        }

        .users-list::-webkit-scrollbar { width: 3px; }
        .users-list::-webkit-scrollbar-thumb { background: var(--matrix-green); }
        .messages-area::-webkit-scrollbar { width: 3px; }
        .messages-area::-webkit-scrollbar-thumb { background: var(--matrix-green); }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <h1 style="font-family: 'Orbitron';" class="text-5xl font-black mb-2 tracking-[15px] text-white">CIPHER</h1>
        <p class="text-[10px] text-zinc-600 mb-8 uppercase tracking-[5px]">Global Network Chat</p>
        
        <div class="flex flex-col items-center">
            <input type="text" id="login-username" placeholder="USERNAME" class="input-cyber" autocomplete="off">
            <button onclick="login()" class="btn-auth">Connect</button>
        </div>
        <div id="login-status" class="mt-6 text-[10px] text-blue-900 uppercase">Awaiting credentials...</div>
    </div>

    <!-- MAIN CHAT INTERFACE -->
    <div id="main-container">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>CIPHER NETWORK</h2>
                <div class="user-info">You: <span id="current-user">---</span></div>
                <button onclick="logout()" class="logout-btn">Logout</button>
            </div>

            <!-- TABS -->
            <div class="tabs-container">
                <button class="tab-btn active" onclick="switchTab('global')">Global</button>
                <button class="tab-btn" onclick="switchTab('direct')">Direct</button>
            </div>

            <!-- USERS/CONVERSATIONS LIST -->
            <div id="users-list" class="users-list"></div>
        </div>

        <!-- CHAT AREA -->
        <div class="chat-container">
            <div class="chat-header">
                <div>
                    <div class="chat-header-title" id="chat-title">Global Chat</div>
                    <div class="chat-header-subtitle" id="chat-subtitle">All users connected</div>
                </div>
            </div>

            <div id="messages-area" class="messages-area">
                <div class="empty-chat">
                    <span style="font-size: 2rem;">✓</span>
                    <p>Select a chat to begin</p>
                </div>
            </div>

            <div class="input-area">
                <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
                <button onclick="sendMessage()" class="send-btn">SEND</button>
            </div>
        </div>
    </div>

    <script>
        // FIREBASE CONFIG
        const firebaseConfig = {
            databaseURL: "https://cipher-global-default-rtdb.firebaseio.com/"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let currentUser = "";
        let currentChatMode = "global"; // global or direct
        let currentDirectUser = ""; // recipient for direct messages
        let allUsers = {};
        let loadedMessages = new Set(); // Track loaded messages to prevent duplicates

        // LOGIN
        function login() {
            const username = document.getElementById('login-username').value.trim();
            if (!username || username.length < 2) {
                alert('Username must be at least 2 characters');
                return;
            }

            currentUser = username;
            document.getElementById('login-screen').classList.add('login-hidden');
            document.getElementById('main-container').style.display = 'flex';
            document.getElementById('current-user').innerText = currentUser;

            // Register user online
            const userRef = database.ref(`users/${currentUser}`);
            userRef.set({
                username: currentUser,
                online: true,
                timestamp: new Date().getTime()
            });

            // Load users list
            loadUsers();
            // Load global messages on start
            loadGlobalMessages();

            // Set up enter key
            document.getElementById('message-input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
        }

        // LOGOUT
        function logout() {
            database.ref(`users/${currentUser}`).remove();
            database.ref('messages/global').off();
            database.ref('messages/direct').off();
            currentUser = "";
            currentChatMode = "global";
            currentDirectUser = "";
            loadedMessages.clear();
            document.getElementById('login-screen').classList.remove('login-hidden');
            document.getElementById('main-container').style.display = 'none';
            document.getElementById('login-username').value = "";
            document.getElementById('messages-area').innerHTML = '<div class="empty-chat"><span style="font-size: 2rem;">✓</span><p>Select a chat to begin</p></div>';
        }

        // SWITCH TABS
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            currentChatMode = tab;
            currentDirectUser = "";
            loadedMessages.clear();
            document.getElementById('users-list').innerHTML = "";
            
            // Turn off all listeners
            database.ref('messages/global').off();
            database.ref('messages/direct').off();
            
            if (tab === 'global') {
                document.getElementById('chat-title').innerText = "Global Chat";
                document.getElementById('chat-subtitle').innerText = "All users connected";
                clearMessages();
                loadGlobalUsers();
                loadGlobalMessages();
            } else {
                loadDirectUsers();
                clearMessages();
            }
        }

        // LOAD ALL USERS
        function loadUsers() {
            database.ref('users').on('value', (snapshot) => {
                allUsers = {};
                snapshot.forEach((child) => {
                    const user = child.val();
                    if (user.username !== currentUser) {
                        allUsers[user.username] = user;
                    }
                });
                if (currentChatMode === 'global') {
                    loadGlobalUsers();
                } else {
                    loadDirectUsers();
                }
            });
        }

        // LOAD GLOBAL USERS
        function loadGlobalUsers() {
            const usersList = document.getElementById('users-list');
            usersList.innerHTML = '<div style="padding: 12px; color: #666; font-size: 0.85rem;">📢 GLOBAL CHAT</div>';
            
            const globalDiv = document.createElement('div');
            globalDiv.className = 'user-item active';
            globalDiv.innerHTML = '<div class="user-name">All Users</div><div class="user-status">Public Channel (' + Object.keys(allUsers).length + ')</div>';
            globalDiv.onclick = () => selectGlobalChat();
            usersList.appendChild(globalDiv);
        }

        // LOAD DIRECT USERS
        function loadDirectUsers() {
            const usersList = document.getElementById('users-list');
            usersList.innerHTML = '<div style="padding: 12px; color: #666; font-size: 0.85rem;">💬 DIRECT MESSAGES</div>';
            
            Object.keys(allUsers).forEach(username => {
                const div = document.createElement('div');
                div.className = 'user-item' + (currentDirectUser === username ? ' active' : '');
                div.innerHTML = `<div class="user-name">${username}</div><div class="user-status">● Online</div>`;
                div.onclick = () => selectDirectChat(username);
                usersList.appendChild(div);
            });
        }

        // SELECT GLOBAL CHAT
        function selectGlobalChat() {
            currentChatMode = "global";
            currentDirectUser = "";
            loadedMessages.clear();
            document.getElementById('chat-title').innerText = "Global Chat";
            document.getElementById('chat-subtitle').innerText = "All users connected - " + Object.keys(allUsers).length + " online";
            clearMessages();
            
            // Turn off all listeners
            database.ref('messages/global').off();
            database.ref('messages/direct').off();
            
            loadGlobalUsers();
            loadGlobalMessages();
        }

        // SELECT DIRECT CHAT
        function selectDirectChat(username) {
            currentChatMode = "direct";
            currentDirectUser = username;
            loadedMessages.clear();
            document.getElementById('chat-title').innerText = username;
            document.getElementById('chat-subtitle').innerText = "Direct message - ● Online";
            clearMessages();
            
            // Turn off all listeners
            database.ref('messages/global').off();
            database.ref('messages/direct').off();
            
            loadDirectUsers();
            loadDirectMessages(username);
        }

        // LOAD GLOBAL MESSAGES
        function loadGlobalMessages() {
            const messagesRef = database.ref('messages/global');
            messagesRef.limitToLast(50).on('child_added', (snapshot) => {
                const data = snapshot.val();
                const key = snapshot.key;
                
                if (!loadedMessages.has(key)) {
                    loadedMessages.add(key);
                    displayMessage(data.sender, data.text, data.time, data.sender === currentUser);
                }
            });
        }

        // LOAD DIRECT MESSAGES
        function loadDirectMessages(recipient) {
            const messagesRef = database.ref('messages/direct');
            messagesRef.limitToLast(100).on('child_added', (snapshot) => {
                const data = snapshot.val();
                const key = snapshot.key;
                
                const isFromCurrentToRecipient = data.sender === currentUser && data.recipient === recipient;
                const isFromRecipientToCurrent = data.sender === recipient && data.recipient === currentUser;
                
                if ((isFromCurrentToRecipient || isFromRecipientToCurrent) && !loadedMessages.has(key)) {
                    loadedMessages.add(key);
                    displayMessage(data.sender, data.text, data.time, isFromCurrentToRecipient);
                }
            });
        }

        // DISPLAY MESSAGE
        function displayMessage(sender, text, time, isSent) {
            const messagesArea = document.getElementById('messages-area');
            if (messagesArea.querySelector('.empty-chat')) {
                messagesArea.innerHTML = "";
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = 'message' + (isSent ? ' sent' : ' received');
            messageDiv.innerHTML = `
                <div class="message-bubble"><strong>${sender}:</strong> ${escapeHtml(text)}</div>
                <div class="message-time">${time}</div>
            `;
            messagesArea.appendChild(messageDiv);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        // SEND MESSAGE
        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second: '2-digit'});

            if (currentChatMode === "global") {
                database.ref('messages/global').push({
                    sender: currentUser,
                    text: text,
                    time: time,
                    timestamp: new Date().getTime()
                });
            } else if (currentChatMode === "direct" && currentDirectUser) {
                database.ref('messages/direct').push({
                    sender: currentUser,
                    recipient: currentDirectUser,
                    text: text,
                    time: time,
                    timestamp: new Date().getTime()
                });
            }

            input.value = "";
            input.focus();
        }

        // CLEAR MESSAGES
        function clearMessages() {
            const messagesArea = document.getElementById('messages-area');
            messagesArea.innerHTML = '<div class="empty-chat"><span style="font-size: 2rem;">✓</span><p>Loading messages...</p></div>';
        }

        // ESCAPE HTML (XSS PROTECTION)
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
